[ViewCompanion Plot Configuration]
; A1 plotter profile with fit-to-page and landscape output.
;
; Remove the leading semicolon from PRINTERNAME, DRIVERNAME and PORTNAME
; after replacing the sample values with the exact names shown in Windows.
; These values are specific to each printer installation.
;
; PRINTERNAME=Engineering Plotter
; DRIVERNAME=Printer Driver Name
; PORTNAME=Printer Port Name
SCALE=FIT
CENTER=ON
PAPERSIZE=A1
ORIENTATION=2
COPIES=1
MONOCHROME=OFF
